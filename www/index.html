<!DOCTYPE html>
<html lang ="zh-CN">

<head>
<meta charset="UTF-8">
<title>我的Webserver</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>我的c++Webserver</h1>
    <p>这是我的服务器页面</p>
    <h2>Echo 测试</h2>

<textarea id="message" rows="5" cols="40"
          placeholder="输入发送给服务器的内容"></textarea>

<p>
    <button id="send" type="button">发送</button>
</p>

<p id="status"></p>
<pre id="result"></pre>

<h2>服务器状态</h2>

<p>当前连接数：<span id="active-connections">—</span></p>
<p>待完成任务数：<span id="pending-tasks">—</span></p>
<p>运行时间：<span id="uptime">—</span> 秒</p>

<button id="refresh-status" type="button">刷新状态</button>
<p id="server-status-message"></p>

<script src="/app.js"></script>
</body>
</html>
